<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root { color-scheme: light dark; --border: #8884; --muted: #888; --accent: #2f6feb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); }
  h1 { margin: 0 0 12px; font-size: 18px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px 10px; font: inherit; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; }
  #filterBox { position: relative; margin-top: 8px; }
  #filterBox svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  #filter { display: block; width: 100%; padding: 10px 96px 10px 36px; border-radius: 12px; }
  #filter:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #count { position: absolute; right: 8px; top: 50%; translate: 0 -50%; padding: 3px 14px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
  mark { background: #f6d476; color: #222; border-radius: 4px; padding: 1px 2px; }
  #skills.filtering .skill .name { display: inline; font-family: ui-monospace, monospace; }
  #skills.filtering .skill .description { display: inline; margin-left: 8px; }
  #skills.filtering li.skill { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #skills.filtering .skill .link { display: none; }
  #skills.filtering .skill .updated { display: none; }
  .updated { color: var(--muted); font-size: 12px; }
  button { padding: 8px 16px; font: inherit; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  main { display: grid; grid-template-columns: minmax(260px, 2fr) 3fr; min-height: 0; }
  #list { border-right: 1px solid var(--border); padding: 12px 0; }
  #summary { padding: 0 24px 8px; font-weight: 600; }
  #error { margin: 16px 24px; color: #d33; white-space: pre-wrap; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 24px; cursor: pointer; border-left: 3px solid transparent; }
  li:hover { background: #8881; }
  li[aria-selected="true"] { border-left-color: var(--accent); background: #8882; }
  #badge { align-self: center; padding: 4px 12px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }
  #progress { height: 6px; margin-top: 8px; border-radius: 3px; background: #8883; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #digest { padding: 0 24px 4px; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  li.repo { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; font-family: ui-monospace, monospace; }
  li.repo .count { color: var(--accent); white-space: nowrap; }
  li.more { color: var(--accent); font-weight: 600; }
  li.skill.nested { padding-left: 40px; }
  .name { font-weight: 600; }
  .description { color: var(--muted); font-size: 14px; }
  .link { display: block; font-size: 12px; overflow-wrap: anywhere; }
  h1 a { float:right; font-size:14px; color:var(--accent); }
  #warnings { margin: 12px 24px; color: #b80; font-size: 13px; }
  #warnings li { padding: 2px 0; cursor: default; border: 0; background: none; }
  #skill { padding: 16px 24px; min-width: 0; }
  #skill h2 { margin: 0 0 8px; font-size: 16px; }
  pre { margin: 0 0 12px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, monospace; }
  #frontMatter { background: #8881; }
  .placeholder { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Skill Atlas <a href="/map">The skill map →</a></h1>
  <form id="form">
    <input id="repo" name="repo" type="text" placeholder="https://github.com/owner/repo, an owner, or a local directory" aria-label="Repository link" required autofocus>
    <span id="badge" hidden></span>
    <button id="scan" type="submit">Scan</button>
  </form>
  <div id="progress" hidden><div id="bar"></div></div>
  <div id="filterBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="filter" type="search" placeholder="Filter the skills" aria-label="Filter skills">
    <span id="count" hidden></span>
  </div>
</header>
<main>
  <section id="list">
    <div id="error" role="alert" hidden></div>
    <div id="summary"></div>
    <div id="digest" hidden></div>
    <ul id="skills"></ul>
    <ul id="warnings"></ul>
  </section>
  <section id="skill">
    <p class="placeholder" id="placeholder">Scan a repository, then select a skill to see its SKILL.md.</p>
    <div id="details" hidden>
      <h2 id="title"></h2>
      <a id="link" class="link" target="_blank" rel="noreferrer"></a>
      <pre id="frontMatter" hidden></pre>
      <pre id="body"></pre>
    </div>
  </section>
</main>
<script>
// Everything from the repository goes in with textContent: a SKILL.md is untrusted text.
const $ = (id) => document.getElementById(id);
const element = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

// The last rendered scan, for client-side filtering; null before and between scans.
let current = null;
// The selected skill's id, kept across filtering and progressive organization renders.
let selectedId = null;
// Grows on every new scan, so a stale page loop stops rendering.
let scanId = 0;
// Organization digest state: "+K more" expanded, and the repositories whose skills are open.
let expandedAll = false;
let expandedRepos = new Set();

/** An owner URL, as in spec/organization.md: github.com plus exactly one path segment. */
const OWNER_URL = /^(?:https?:\/\/)?(?:www\.)?github\.com\/[\w-]+\/?$/i;

$('form').addEventListener('submit', (event) => {
  event.preventDefault();
  const repo = $('repo').value.trim();
  history.pushState(null, '', address(repo));
  scan(repo);
});
$('filter').addEventListener('input', () => {
  history.replaceState(null, '', address($('repo').value.trim()));
  if (current) applyFilter();
});
addEventListener('popstate', () => load());
load();

/** `?repo=<link>`, with `&filter=<words>` unless the filter is blank. */
function address(repo) {
  const params = new URLSearchParams();
  if (repo) params.set('repo', repo);
  const filter = $('filter').value;
  if (filter.trim()) params.set('filter', filter);
  return params.size ? `?${params}` : location.pathname;
}

function load() {
  const params = new URLSearchParams(location.search);
  const repo = params.get('repo') ?? '';
  $('repo').value = repo;
  $('filter').value = params.get('filter') ?? '';
  if (repo) scan(repo);
  else clear();
}

function clear() {
  current = null;
  selectedId = null;
  expandedAll = false;
  expandedRepos = new Set();
  $('error').hidden = true;
  $('count').hidden = true;
  $('summary').textContent = '';
  $('digest').hidden = true;
  $('badge').hidden = true;
  $('progress').hidden = true;
  $('bar').style.width = '0%';
  $('skills').replaceChildren();
  $('warnings').replaceChildren();
  show(undefined);
}

async function scan(repo) {
  clear();
  const id = ++scanId;
  $('scan').disabled = true;
  $('summary').textContent = 'Scanning…';
  try {
    if (OWNER_URL.test(repo)) await scanOrganization(repo, id);
    else {
      const result = await api(repo);
      if (id !== scanId) return;
      render({
        mode: 'repository',
        label: result.repository.id,
        groups: [{ repository: result.repository, skills: result.skills }],
        warnings: result.warnings,
      });
    }
  } catch (error) {
    if (id !== scanId) return;
    $('summary').textContent = '';
    $('error').textContent = error.message;
    $('error').hidden = false;
  } finally {
    if (id === scanId) $('scan').disabled = false;
  }
}

/** The listing alone first — the badge appears at once — then every page, appended as it arrives. */
async function scanOrganization(repo, id) {
  const listing = await api(repo, 0);
  if (id !== scanId) return;
  $('badge').textContent = count(listing.repositoryCount, 'repository', 'repositories');
  $('badge').hidden = false;
  $('progress').hidden = false;
  const pages = [];
  renderOrganizationPages(listing, pages, listing.pageCount > 0);
  for (let page = 1; page <= listing.pageCount; page++) {
    const next = await api(repo, page);
    if (id !== scanId) return;
    pages.push(next);
    $('bar').style.width = `${(page / listing.pageCount) * 100}%`;
    renderOrganizationPages(listing, pages, page < listing.pageCount);
  }
}

async function api(repo, page) {
  const response = await fetch(`/api/scan?repo=${encodeURIComponent(repo)}${page === undefined ? '' : `&page=${page}`}`);
  const result = await response.json();
  if (!response.ok) throw new Error(result.error);
  return result;
}

function renderOrganizationPages(listing, pages, loading) {
  const sections = pages.flatMap((page) => page.repositories);
  render({
    mode: 'organization',
    label: listing.organization.name,
    repositoryCount: listing.repositoryCount,
    groups: sections.map((section) => ({ repository: section.repository, skills: section.skills })),
    warnings: [
      ...listing.warnings,
      ...pages.flatMap((page) => page.warnings),
      ...sections.flatMap((section) => section.warnings.map((warning) => `${section.repository.id}: ${warning}`)),
    ],
    loading,
  });
}

/**
 * One list for both modes. A repository scan lists the skills flat; an organization is a digest:
 * one row per repository with skills, its entries under it when the row is selected, and "+K more".
 */
function render(state) {
  current = state;
  state.rows = [];
  for (const group of state.groups) {
    let groupRow;
    if (state.mode === 'organization') {
      if (!group.skills.length) continue;
      groupRow = { group, element: repoRow(group) };
      state.rows.push(groupRow);
    }
    for (const skill of group.skills) {
      state.rows.push({ group, groupRow, skill, element: skillItem(skill, state.mode === 'organization') });
    }
  }
  const children = state.rows.map((row) => row.element);
  if (state.mode === 'organization') {
    state.more = element('li', 'more');
    state.more.tabIndex = 0;
    const expand = () => { expandedAll = true; applyFilter(); };
    state.more.addEventListener('click', expand);
    state.more.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); expand(); } });
    children.push(state.more);
  }
  $('skills').replaceChildren(...children);
  $('warnings').replaceChildren(...state.warnings.map((warning) => element('li', '', `warning: ${warning}`)));
  applyFilter();
}

/** `<name>  ·  n skills`; selecting it opens the repository's skill entries under the row. */
function repoRow(group) {
  const row = element('li', 'repo');
  row.tabIndex = 0;
  row.append(element('span', 'name', group.repository.name), element('span', 'count'));
  const toggle = () => {
    const id = group.repository.id;
    if (expandedRepos.has(id)) expandedRepos.delete(id);
    else expandedRepos.add(id);
    applyFilter();
  };
  row.addEventListener('click', toggle);
  row.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); } });
  return row;
}

function skillItem(skill, nested) {
  const item = element('li', nested ? 'skill nested' : 'skill');
  item.tabIndex = 0;
  item.setAttribute('role', 'option');
  item.append(element('div', 'name', skill.name));
  if (skill.description) item.append(element('div', 'description', skill.description));
  for (const [index, href] of [skill.link, ...skill.alternateLinks].entries()) {
    const link = element('a', 'link', index ? `also: ${href}` : href);
    link.href = href;
    link.target = '_blank';
    link.rel = 'noreferrer';
    link.addEventListener('click', (event) => event.stopPropagation());
    item.append(link);
  }
  if (skill.updated) item.append(element('div', 'updated', `updated ${skill.updated}`));
  const select = () => { selectedId = skill.id; applySelection(); };
  item.addEventListener('click', select);
  item.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(); } });
  return item;
}

function count(n, one, many = `${one}s`) {
  return `${n} ${n === 1 ? one : many}`;
}

/**
 * Hides what the filter drops, counts the rest in the headers and the field's `M of N` badge,
 * redraws the matching entries as compact rows with the matched words highlighted, and keeps a
 * visible selection.
 */
function applyFilter() {
  const filter = $('filter').value;
  const words = filter.toLowerCase().split(/\s+/).filter(Boolean);
  const skillRows = current.rows.filter((row) => row.skill);
  for (const row of skillRows) row.matching = matches(row.skill, words);
  $('skills').classList.toggle('filtering', words.length > 0);
  for (const row of skillRows) renderEntry(row.element, row.skill, row.matching ? words : []);

  if (current.mode === 'organization') {
    // The digest: rows with matching skills, the first three unless "+K more" was selected.
    const repoRows = current.rows.filter((row) => !row.skill);
    const withSkills = repoRows.filter((row) => skillRows.some((other) => other.group === row.group && other.matching));
    withSkills.forEach((row, index) => { row.truncated = !expandedAll && index >= 3; });
    for (const row of repoRows) {
      const matching = skillRows.filter((other) => other.group === row.group && other.matching).length;
      row.element.hidden = !withSkills.includes(row) || row.truncated;
      row.element.lastChild.textContent = count(matching, 'skill');
    }
    for (const row of skillRows) {
      row.element.hidden = !(row.matching && row.groupRow && !row.groupRow.element.hidden
        && expandedRepos.has(row.group.repository.id));
    }
    const truncated = withSkills.filter((row) => row.truncated).length;
    $('digest').textContent = `${withSkills.length} with skills${truncated ? ', among them' : ''}`;
    $('digest').hidden = false;
    current.more.hidden = !truncated;
    current.more.textContent = `+${truncated} more`;
  } else {
    for (const row of skillRows) row.element.hidden = !row.matching;
  }

  const shown = skillRows.filter((row) => row.matching).length;
  const total = count(skillRows.length, 'skill');
  const prefix = current.mode === 'organization'
    ? `${current.label} · ${count(current.repositoryCount, 'repository', 'repositories')}`
    : current.label;
  $('summary').textContent =
    `${prefix} · ${words.length ? `${shown} of ${total}` : total}${current.loading ? ' · scanning…' : ''}`;
  $('count').textContent = `${shown} of ${skillRows.length}`;
  $('count').hidden = !words.length;
  applySelection();
}

/** The selected skill if it is still visible, else the first visible one, else nothing. */
function applySelection() {
  const rows = current.rows.filter((row) => row.skill);
  const visible = rows.filter((row) => !row.element.hidden);
  const selected = visible.find((row) => row.skill.id === selectedId) ?? visible[0];
  selectedId = selected ? selected.skill.id : null;
  for (const row of rows) row.element.setAttribute('aria-selected', String(row === selected));
  show(selected && selected.skill);
}

/** The filter of spec/cli.md: every word in the name or description, a case-insensitive substring. */
function matches(skill, words) {
  const name = skill.name.toLowerCase();
  const description = skill.description.toLowerCase();
  return words.every((word) => name.includes(word) || description.includes(word));
}

/**
 * The entry's text: the full name and description normally; while filtering, the matched words are
 * highlighted and the description shrinks to a snippet around its first match.
 */
function renderEntry(item, skill, words) {
  item.querySelector('.name').replaceChildren(...(words.length ? highlighted(skill.name, words) : [skill.name]));
  const description = item.querySelector('.description');
  if (!description) return;
  if (!words.length) {
    description.textContent = skill.description;
    return;
  }
  const lower = skill.description.toLowerCase();
  let first = -1;
  let length = 0;
  for (const word of words) {
    const at = lower.indexOf(word);
    if (at !== -1 && (first === -1 || at < first)) { first = at; length = word.length; }
  }
  if (first === -1) {
    description.textContent = '';
    return;
  }
  const start = Math.max(0, first - 20);
  const end = Math.min(skill.description.length, first + length + 40);
  const snippet = (start ? '…' : '') + skill.description.slice(start, end) + (end < skill.description.length ? '…' : '');
  description.replaceChildren(...highlighted(snippet, words));
}

/** The text as nodes, each case-insensitive occurrence of a word wrapped in a safe `<mark>`. */
function highlighted(text, words) {
  const lower = text.toLowerCase();
  const nodes = [];
  let from = 0;
  while (from < text.length) {
    let at = -1;
    let length = 0;
    for (const word of words) {
      const found = lower.indexOf(word, from);
      if (found !== -1 && (at === -1 || found < at || (found === at && word.length > length))) { at = found; length = word.length; }
    }
    if (at === -1) break;
    if (at > from) nodes.push(document.createTextNode(text.slice(from, at)));
    nodes.push(element('mark', '', text.slice(at, at + length)));
    from = at + length;
  }
  if (from < text.length) nodes.push(document.createTextNode(text.slice(from)));
  return nodes;
}

function show(skill) {
  $('placeholder').hidden = Boolean(skill);
  $('details').hidden = !skill;
  if (!skill) return;
  $('title').textContent = skill.name;
  $('link').textContent = skill.path;
  $('link').href = skill.link;
  const { frontMatter, body } = split(skill.contents);
  $('frontMatter').hidden = !frontMatter;
  $('frontMatter').textContent = frontMatter;
  $('body').textContent = body;
}

/** The front matter between the leading `---` lines, and the instructions after it. */
function split(contents) {
  const match = /^\s*---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)([\s\S]*)$/.exec(contents);
  return match ? { frontMatter: match[1], body: match[2].replace(/^\s*\n/, '') } : { frontMatter: '', body: contents };
}
</script>
</body>
</html>
