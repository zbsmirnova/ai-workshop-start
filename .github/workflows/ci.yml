# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
      # The web view on the fixture repository: the page and the scan must answer.
      - name: Web view smoke test
        run: |
          ./skill-atlas serve --port 4173 &
          trap 'kill $!' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:4173/ | grep -q 'Repository link'
          curl -fsS 'http://localhost:4173/api/scan?repo=./fixture' | grep -q '"name":"commits"'
